[general]
symbol = EURUSD
allow_new_trades = true
max_concurrent_trades = 3
spread = 0.0002
stop_buffer = 0.0001
stop_lookback = 5

[risk]
account_balance = 10000
risk_percent = 1.0
contract_size = 100000
pip_value = 1.0

[moving_average]
periods = 8,50,100
ma_type = sma

[cci]
period = 40
upper_threshold = 100
lower_threshold = -100

[targets]
reward_risk_levels = 1,1.5,2.0,3.0
break_even_steps = 1,2

[partial_close]
# Define partial closes as RR@fraction, e.g. 1.5@0.5 closes 50% of remaining size at 1.5R
levels = 1.5@0.5,2.5@0.5
